[project]
name = "predheat"
version = "0.6.4"
description = "PredHeat: self-learning heat pump and home energy optimiser (Home Assistant proof of concept)"
readme = "DOCS.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "coLaunch Limited" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "websockets>=12",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "typer>=0.12",
    "rich>=13",
    "python-dateutil>=2.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
predheat = "predheat.cli:app"
predheat-addon = "predheat.addon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predheat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
