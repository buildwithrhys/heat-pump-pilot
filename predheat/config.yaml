name: PredHeat
version: "0.2.2"
slug: predheat
description: Self-learning heat pump and home energy optimiser.
url: https://github.com/buildwithrhys/predheat
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: false
ingress: true
ingress_port: 8750
panel_icon: mdi:heat-pump
panel_title: PredHeat
watchdog: http://[HOST]:[PORT:8750]/api/health
ports:
  8750/tcp: null
ports_description:
  8750/tcp: Direct access to the API and dashboard. Optional, the sidebar panel uses ingress.
options:
  data_mode: home_assistant
  poll_seconds: 300
  log_level: info
  control_enabled: false
schema:
  data_mode: list(home_assistant|simulated)
  poll_seconds: int(60,3600)
  log_level: list(debug|info|warning|error)
  control_enabled: bool
  control_climate_entity: str?
